name: Yocto Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:24.04

    steps:
      - name: Install Dependencies
        run: |
          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-git \
            python3-jinja2 xz-utils zstd lz4 liblz4-tool \
            debianutils iputils-ping file rsync locales \
            ca-certificates sudo

          locale-gen en_US.UTF-8

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Builder User
        run: |
          useradd -m -s /bin/bash builder

          mkdir -p /home/builder

          chown -R builder:builder \
            "$GITHUB_WORKSPACE" \
            /home/builder

      - name: Clone Poky
        run: |
          mkdir -p yocto-setup

          if [ ! -d yocto-setup/poky ]; then
            git clone \
              --depth=1 \
              -b scarthgap \
              https://git.yoctoproject.org/git/poky \
              yocto-setup/poky
          fi

          chown -R builder:builder yocto-setup

      - name: Cache Downloads
        uses: actions/cache@v4
        with:
          path: yocto-cache/downloads
          key: yocto-downloads-${{ runner.os }}-scarthgap
          restore-keys: |
            yocto-downloads-${{ runner.os }}-

      - name: Cache SState
        uses: actions/cache@v4
        with:
          path: yocto-cache/sstate-cache
          key: yocto-sstate-${{ runner.os }}-scarthgap
          restore-keys: |
            yocto-sstate-${{ runner.os }}-

      - name: Build Yocto Image
        run: |
          mkdir -p yocto-cache/downloads
          mkdir -p yocto-cache/sstate-cache

          chown -R builder:builder yocto-cache

          su builder -c "
            export LANG=en_US.UTF-8
            export LC_ALL=en_US.UTF-8

            cd $GITHUB_WORKSPACE/yocto-setup/poky

            . ./oe-init-build-env build

            cat <<EOF >> conf/local.conf

            DL_DIR = \"${GITHUB_WORKSPACE}/yocto-cache/downloads\"
            SSTATE_DIR = \"${GITHUB_WORKSPACE}/yocto-cache/sstate-cache\"

            BB_NUMBER_THREADS = \"2\"
            PARALLEL_MAKE = \"-j 2\"

            IMAGE_FSTYPES += \"wic\"

            EOF

            bitbake core-image-minimal
          "

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-image
          path: |
            yocto-setup/poky/build/tmp/deploy/images/qemux86-64/*.wic*
            yocto-setup/poky/build/tmp/deploy/images/qemux86-64/*.ext4
            yocto-setup/poky/build/tmp/deploy/images/qemux86-64/bzImage*
