name: Yocto Production CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-yocto:
    runs-on: ubuntu-latest
    
    # Run the build inside a clean Ubuntu container
    container:
      image: ubuntu:24.04

    steps:
      # 1. Install all required host packages & generate locales inside the container
      - name: Install Host dependencies
        run: |
          apt-get update && apt-get install -y \
            gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip xz-utils debianutils \
            iputils-ping python3-git python3-jinja2 zstd liblz4-tool \
            file locales ca-certificates lz4 rsync
            
          # Generate and set the required en_US.UTF-8 locales
          locale-gen en_US.UTF-8
          update-locale LANG=en_US.UTF-8

      # 2. Checkout your code
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # 3. Cache Management (Separated into two caches to stay under the 10GB limit)
      - name: Restore/Save Yocto Downloads Cache
        uses: actions/cache@v4
        with:
          path: yocto-setup/poky/build/downloads
          key: yocto-downloads-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            yocto-downloads-${{ runner.os }}-

      - name: Restore/Save Yocto SState Cache
        uses: actions/cache@v4
        with:
          path: yocto-setup/poky/build/sstate-cache
          key: yocto-sstate-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            yocto-sstate-${{ runner.os }}-

      # 4. Clone Poky (Only if it was not already restored from Cache)
      - name: Setup Yocto Poky Environment
        shell: bash
        run: |
          mkdir -p yocto-setup && cd yocto-setup
          if [ ! -d "poky" ]; then
            echo "Poky directory not found in cache. Cloning..."
            git clone --depth=1 -b scarthgap https://git.yoctoproject.org/git/poky
          else
            echo "Poky directory restored from cache. Skipping clone."
          fi

      # 5. Build the Minimal Image
      - name: Compile OS Image via BitBake
        shell: bash
        run: |
          # 1. Configure git safety
          git config --global safe.directory "*"
          
          # 2. Enter Poky directory and initialize the Yocto environment
          cd $GITHUB_WORKSPACE/yocto-setup/poky
          
          # CRITICAL: Sourced with direct relative path so Bash finds it instantly
          source ./oe-init-build-env $GITHUB_WORKSPACE/yocto-setup/poky/build
          
          # 3. Configure local.conf options directly inside the active build folder
          echo 'FETCHCMD:wget = "/usr/bin/env wget -t 2 -T 100 --no-check-certificate"' >> conf/local.conf
          echo 'PREMIRRORS:prepend = " git://.*/.* http://downloads.yoctoproject.org/mirror/sources/ "' >> conf/local.conf
          echo 'INHERIT:remove = "sanity"' >> conf/local.conf
          echo 'IMAGE_FSTYPES += "wic"' >> conf/local.conf
          
          # 4. Set environment exports for execution
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          export FORCE_UNSAFE_TO_ROOT=1
          
          # 5. Compile the target
          bitbake core-image-minimal

      # 6. Resolve file permissions between Container and Runner Host
      - name: Fix Workspace Ownership for Host Runner
        if: always()
        run: |
          chown -R $(stat -c "%u:%g" $GITHUB_WORKSPACE) $GITHUB_WORKSPACE

      # 7. Upload all helpful boot and flash files
      - name: Upload Bootable Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-bootable-sdcard-image
          # Multi-line path filter matching only the critical files from your deploy folder
          path: |
            yocto-setup/poky/build/tmp/deploy/images/qemux86-64/*.wic*
            yocto-setup/poky/build/tmp/deploy/images/qemux86-64/*.ext4
            yocto-setup/poky/build/tmp/deploy/images/qemux86-64/bzImage*
            yocto-setup/poky/build/tmp/deploy/images/qemux86-64/*.qemuboot.conf
            yocto-setup/poky/build/tmp/deploy/images/qemux86-64/*.manifest
          retention-days: 5
