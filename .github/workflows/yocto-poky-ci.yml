name: Yocto CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:24.04

    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y \
            gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip xz-utils \
            debianutils iputils-ping python3-git python3-jinja2 \
            zstd liblz4-tool file locales lz4 rsync

          locale-gen en_US.UTF-8

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Poky
        run: |
          mkdir -p yocto-setup

          git clone \
            --depth=1 \
            --branch scarthgap \
            https://git.yoctoproject.org/git/poky \
            yocto-setup/poky

      - name: Restore Downloads Cache
        uses: actions/cache@v4
        with:
          path: yocto-cache/downloads
          key: yocto-downloads-${{ runner.os }}-scarthgap
          restore-keys: |
            yocto-downloads-${{ runner.os }}-

      - name: Restore SState Cache
        uses: actions/cache@v4
        with:
          path: yocto-cache/sstate-cache
          key: yocto-sstate-${{ runner.os }}-scarthgap
          restore-keys: |
            yocto-sstate-${{ runner.os }}-

      - name: Build Image
        shell: bash
        run: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8

          cd yocto-setup/poky

          . ./oe-init-build-env build

          cat >> conf/local.conf << EOF
          DL_DIR = "${TOPDIR}/../../../yocto-cache/downloads"
          SSTATE_DIR = "${TOPDIR}/../../../yocto-cache/sstate-cache"
          IMAGE_FSTYPES += "wic"
          EOF

          bitbake core-image-minimal

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-image
          path: |
            yocto-setup/poky/build/tmp/deploy/images/qemux86-64/*.wic*
            yocto-setup/poky/build/tmp/deploy/images/qemux86-64/*.ext4
            yocto-setup/poky/build/tmp/deploy/images/qemux86-64/*.manifest
            yocto-setup/poky/build/tmp/deploy/images/qemux86-64/bzImage*